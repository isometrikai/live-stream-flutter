buildscript {
    ext.kotlin_version = '2.2.20'
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.google.gms:google-services:4.3.15'
        classpath 'com.android.tools.build:gradle:8.11.1'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        // DeepAR SDK only — flutter_deepar injects this repo without a content
        // filter, which makes Gradle ask it for androidx.* and get HTTP 403.
        exclusiveContent {
            forRepository {
                maven {
                    url 'https://sdk.developer.deepar.ai/maven-android-repository/releases/'
                }
            }
            filter {
                includeGroup 'ai.deepar.ar'
            }
        }
    }

    // Clamp any unfiltered DeepAR repo added by flutter_deepar's build.gradle.
    repositories.whenObjectAdded { repo ->
        if (repo instanceof MavenArtifactRepository &&
            repo.url.toString().contains('sdk.developer.deepar.ai')) {
            repo.content {
                includeGroup 'ai.deepar.ar'
            }
        }
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
    project.evaluationDependsOn(':app')
    // Force 16 KB–compatible DeepAR for every Android subproject (incl. flutter_deepar).
    project.configurations.configureEach {
        resolutionStrategy {
            force 'ai.deepar.ar:DeepAR:5.6.22'
        }
    }
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
