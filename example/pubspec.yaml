name: appscrip_live_stream_component_example
description: Demonstrates how to use the appscrip_live_stream_component plugin.

publish_to: "none"
version: 1.0.2
environment:
  sdk: ">=3.1.0 <4.0.0"

dependencies:
  appscrip_live_stream_component:
    path: ../
  cached_network_image: ^3.4.1
  cupertino_icons: ^1.0.2
  device_info_plus: ^12.1.0
  flutter:
    sdk: flutter
  flutter_local_notifications: ^19.3.0
  flutter_screenutil: ^5.9.3
  flutter_secure_storage: ^9.2.2
  get: ^4.7.2
  http: ^1.3.0
  image_cropper: ^12.2.0
  image_picker: ^1.1.2
  in_app_purchase: ^3.3.0
  in_app_purchase_android: ^0.5.0
  in_app_purchase_storekit: ^0.4.2
  package_info_plus: ^9.0.0
  pin_code_fields: ^8.0.1
  shared_preferences: ^2.2.3

dependency_overrides:
  device_info_plus: ^12.1.0
  # Flutter SDK's flutter_test pins `meta` to 1.16.0 in this SDK version.
  # livekit_client (>=2.6.5) requires meta ^1.17.0, so we override to make pub resolve.
  meta: ^1.17.0

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
  - assets/
  - assets/images/
  - assets/icon/
  fonts:
  - family: Satoshi
    fonts:
      - asset: assets/fonts/Satoshi-Regular.ttf
      - asset: assets/fonts/Satoshi-Bold.ttf
        weight: 700
